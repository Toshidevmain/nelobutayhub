<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#09090b" />
  <title>Upload panel — Nelo Butay</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="/tailwind.css" />
</head>
<body class="min-h-screen bg-zinc-950 font-sans text-zinc-100 antialiased">
  <nav class="border-b border-white/[0.07]">
    <div class="mx-auto flex h-16 max-w-4xl items-center justify-between px-5 sm:px-8">
      <a href="/" class="inline-flex items-center gap-2.5 rounded-lg text-sm font-semibold tracking-wide text-zinc-100 transition hover:text-white">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-500 text-white">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4 fill-current"><path d="M8 5.7c0-.77.84-1.25 1.5-.86l9.1 5.3a1 1 0 0 1 0 1.72l-9.1 5.3A1 1 0 0 1 8 16.3V5.7Z"/></svg>
        </span>
        Nelo Butay
      </a>
      <div class="flex items-center gap-3">
        <span class="hidden text-xs text-zinc-500 sm:inline">Upload panel</span>
        <div id="account-controls"></div>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-4xl px-5 py-8 sm:px-8 sm:py-12">
    <header class="mb-8">
      <p class="mb-2 text-xs font-semibold uppercase tracking-[0.16em] text-indigo-300">Library</p>
      <h1 class="text-2xl font-semibold tracking-tight text-white sm:text-3xl">Manage videos</h1>
      <p class="mt-2 text-sm text-zinc-400">Upload a video or remove an existing version.</p>
    </header>

    <form action="/api/upload" method="POST" enctype="multipart/form-data" class="mb-10 rounded-2xl border border-white/10 bg-zinc-900/60 p-5 sm:p-6">
      <label for="video-title" class="mb-2 block text-sm font-medium text-zinc-300">Video title</label>
      <input id="video-title" type="text" name="title" required placeholder="Give your video a title" class="mb-4 min-h-11 w-full rounded-lg border border-white/10 bg-zinc-950 px-3.5 py-2.5 text-sm text-white placeholder:text-zinc-600 transition focus:border-indigo-400/60 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" />
      <div class="flex flex-col gap-3 sm:flex-row">
        <input type="file" name="video" accept="video/*" required class="min-h-11 min-w-0 flex-1 rounded-lg border border-white/10 bg-zinc-950 px-3 py-2 text-sm text-zinc-400 file:mr-3 file:rounded-md file:border-0 file:bg-zinc-800 file:px-3 file:py-1.5 file:text-xs file:font-medium file:text-zinc-200 hover:file:bg-zinc-700" />
        <button type="submit" class="min-h-11 rounded-lg bg-indigo-500 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-400 active:scale-[0.99]">Upload video</button>
      </div>
    </form>

    <section>
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-lg font-semibold text-white">Stored videos</h2>
      </div>
      <div id="list" class="space-y-3"></div>
    </section>

    <a href="/" class="mt-8 inline-flex rounded-lg border border-white/10 bg-zinc-900 px-4 py-2.5 text-sm font-medium text-zinc-300 transition hover:border-white/20 hover:bg-zinc-800 hover:text-white">Return to viewer</a>
  </main>

  <script>
    async function load() {
      const res = await fetch('/api/videos')
      if (res.status === 403) {
        const message = document.createElement('p')
        message.className = 'rounded-xl border border-amber-300/15 bg-amber-300/5 px-4 py-6 text-sm text-amber-200'
        message.textContent = 'Confirm you are 18 or older from the home page to manage videos.'
        document.getElementById('list').replaceChildren(message)
        return
      }
      if (!res.ok) throw new Error('The video library could not be loaded.')
      const vids = await res.json()
      const box = document.getElementById('list')
      box.innerHTML = ''

      if (!vids.length) {
        const empty = document.createElement('p')
        empty.className = 'rounded-xl border border-white/10 bg-zinc-900/50 px-4 py-6 text-sm text-zinc-500'
        empty.textContent = 'No videos have been uploaded yet.'
        box.append(empty)
        return
      }

      vids.forEach(v => {
        const card = document.createElement('article')
        card.className = 'rounded-xl border border-white/10 bg-zinc-900/50 p-4 sm:p-5'
        const title = document.createElement('h3')
        title.className = 'mb-3 truncate text-sm font-semibold text-zinc-100'
        title.textContent = v.title
        const variants = document.createElement('div')
        variants.className = 'flex flex-wrap gap-2'
        card.append(title, variants)

        v.variants.forEach(o => {
          const group = document.createElement('div')
          group.className = 'inline-flex items-center gap-2 rounded-lg border border-white/10 bg-zinc-950/70 py-1 pl-2.5 pr-1'
          const tag = document.createElement('span')
          tag.className = 'text-xs font-medium text-zinc-400'
          tag.textContent = o.quality
          const button = document.createElement('button')
          button.className = 'rounded-md px-2.5 py-1.5 text-xs font-medium text-rose-300 transition hover:bg-rose-500/10 hover:text-rose-200'
          button.textContent = 'Delete'
          button.onclick = async () => {
            const result = await Swal.fire({
              title: 'Delete this version?',
              text: 'This video file will be permanently removed.',
              icon: 'warning',
              background: '#18181b',
              color: '#f4f4f5',
              showCancelButton: true,
              confirmButtonColor: '#e11d48',
              cancelButtonColor: '#3f3f46',
              confirmButtonText: 'Delete version'
            })

            if (result.isConfirmed) {
              button.disabled = true
              button.textContent = 'Deleting…'
              try {
                const response = await fetch('/api/video/' + o.id, { method: 'DELETE' })
                if (!response.ok) throw new Error('Delete failed')
                await Swal.fire({ icon: 'success', title: 'Deleted', text: 'The video version has been removed.', timer: 1300, showConfirmButton: false, background: '#18181b', color: '#f4f4f5' })
              } catch (e) {
                Swal.fire({ icon: 'error', title: 'Could not delete the video', background: '#18181b', color: '#f4f4f5' })
              } finally {
                load()
              }
            }
          }
          group.append(tag, button)
          variants.append(group)
        })
        box.append(card)
      })
    }

    load().catch(() => {
      const message = document.createElement('p')
      message.className = 'rounded-xl border border-rose-500/20 bg-rose-500/5 px-4 py-6 text-sm text-rose-300'
      message.textContent = 'The video library could not be loaded.'
      document.getElementById('list').replaceChildren(message)
    })
  </script>
  <script type="module" src="/site.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#09090b" />
  <title>Watch video — Nelo Butay</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/tailwind.css" />
</head>
<body class="min-h-screen bg-zinc-950 font-sans text-zinc-100 antialiased">
  <nav class="border-b border-white/[0.07]">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5 sm:px-8">
      <a href="/" class="inline-flex items-center gap-2.5 rounded-lg text-sm font-semibold tracking-wide text-zinc-100 transition hover:text-white">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-500 text-white">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4 fill-current"><path d="M8 5.7c0-.77.84-1.25 1.5-.86l9.1 5.3a1 1 0 0 1 0 1.72l-9.1 5.3A1 1 0 0 1 8 16.3V5.7Z"/></svg>
        </span>
        Nelo Butay
      </a>
      <div class="flex items-center gap-2">
        <div id="account-controls"></div>
        <a href="/" class="rounded-lg border border-white/10 bg-zinc-900 px-3.5 py-2 text-sm font-medium text-zinc-300 transition hover:border-white/20 hover:bg-zinc-800 hover:text-white">Browse</a>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl px-5 pb-8 pt-7 sm:px-8 sm:pt-10">
    <p id="watch-status" class="mb-5 hidden rounded-xl border border-amber-300/15 bg-amber-300/5 px-4 py-3 text-sm text-amber-200"></p>
    <p class="mb-2 text-xs font-semibold uppercase tracking-[0.16em] text-indigo-300">Now playing</p>
    <h1 id="title" class="mb-5 text-2xl font-semibold tracking-tight text-white sm:text-3xl"></h1>
    <div class="overflow-hidden rounded-2xl border border-white/10 bg-black shadow-2xl shadow-black/30">
      <video id="vid" controls playsinline class="block aspect-video w-full bg-black object-contain"></video>
    </div>

    <div class="mt-5 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div id="qpills" class="flex flex-wrap items-center gap-2">
        <span class="mr-1 text-sm text-zinc-500">Quality</span>
      </div>
      <a id="dl" href="#" class="inline-flex min-h-10 items-center justify-center rounded-lg border border-white/10 bg-zinc-900 px-4 py-2 text-sm font-semibold text-zinc-200 transition hover:border-white/20 hover:bg-zinc-800">Download video</a>
    </div>

    <section id="discussion" class="mt-10 border-t border-white/[0.08] pt-8">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h2 class="text-xl font-semibold text-white">Join the conversation</h2>
          <p class="mt-1 text-sm text-zinc-500"><span id="comment-count">0 comments</span></p>
        </div>
        <button id="like-button" type="button" aria-pressed="false" class="inline-flex min-h-10 items-center gap-2 rounded-lg border border-white/10 bg-zinc-900 px-4 py-2 text-sm font-medium text-zinc-300 transition hover:border-indigo-400/40 hover:text-white">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4 fill-current"><path d="M7 10v11H3V10h4Zm2 11h8.2a2 2 0 0 0 1.96-1.61l1.25-6.25A2 2 0 0 0 18.45 11H14l.69-3.44A2.3 2.3 0 0 0 12.44 5L9 10v11Z"/></svg>
          <span id="like-label">Like</span>
          <span id="like-count" class="text-zinc-500">0</span>
        </button>
      </div>

      <div class="mt-6 rounded-2xl border border-white/[0.08] bg-zinc-900/50 p-4 sm:p-5">
        <p id="comment-signin" class="text-sm text-zinc-400">
          <a href="/sign-in" class="font-medium text-indigo-300 transition hover:text-indigo-200">Sign in</a>
          to leave a comment or reaction.
        </p>
        <form id="comment-form" class="hidden">
          <label for="comment-input" class="mb-2 block text-sm font-medium text-zinc-300">Your comment</label>
          <textarea id="comment-input" maxlength="1000" rows="3" required placeholder="Share your thoughts…" class="w-full resize-y rounded-xl border border-white/10 bg-zinc-950 px-3.5 py-3 text-sm leading-6 text-white placeholder:text-zinc-600 transition focus:border-indigo-400/60 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"></textarea>
          <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
            <p id="comment-status" role="status" class="text-xs text-zinc-500"></p>
            <button id="comment-submit" type="submit" class="inline-flex min-h-10 items-center justify-center rounded-lg bg-indigo-500 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-400 disabled:cursor-wait disabled:opacity-50">Post comment</button>
          </div>
        </form>
      </div>
      <div id="comments-list" class="mt-5 divide-y divide-white/[0.07]"></div>
    </section>
  </main>

  <footer class="mx-auto max-w-6xl px-5 py-6 text-center text-xs text-zinc-600 sm:px-8">
    &copy; 2026 Nelo Butay <span class="mx-1 text-zinc-700">&middot;</span> Crafted by JHUN DEV
  </footer>

  <script type="module" src="/site.js"></script>
</body>
</html>
